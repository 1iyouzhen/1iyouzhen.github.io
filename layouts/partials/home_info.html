<section class="home-info" aria-label="{{ site.Title }}">
  <h1 class="home-title-sr">{{ site.Title }}</h1>
  <p class="home-description">{{ i18n "homeDescriptionOne" }}<br>{{ i18n "homeDescriptionTwo" }}</p>
  <div class="home-links">
    {{ partial "social_icons.html" (dict "align" site.Params.homeInfoParams.AlignSocialIconsTo) }}
    <a class="home-about" href="{{ "about/" | relLangURL }}">{{ i18n "aboutBlog" }} <span aria-hidden="true">→</span></a>
  </div>
</section>
