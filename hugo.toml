baseURL = 'https://1iyouzhen.github.io/'
title = "Youzhen's Notes"
theme = 'PaperMod'
locale = 'zh-CN'
defaultContentLanguage = 'zh'
defaultContentLanguageInSubdir = false
hasCJKLanguage = true
enableRobotsTXT = true
buildDrafts = false
buildFuture = false
copyright = '© 2026 Youzhen Li'

[pagination]
pagerSize = 8

[permalinks]
posts = '/posts/:slug/'

[outputs]
home = ['HTML', 'RSS', 'JSON']

[taxonomies]
tag = 'tags'
category = 'categories'

[params]
env = 'production'
description = 'Youzhen Li 的个人博客，记录 LLMs 与 AI Infrastructure 的学习笔记、论文阅读和工程实践。'
author = 'Youzhen Li'
keywords = ['Youzhen Li', 'LLM', 'AI Infrastructure', '机器学习', '学习笔记']
defaultTheme = 'auto'
disableThemeToggle = false
ShowReadingTime = true
ShowShareButtons = false
ShowPostNavLinks = true
ShowBreadCrumbs = true
ShowCodeCopyButtons = true
ShowWordCount = true
ShowRssButtonInSectionTermList = true
ShowToc = true
TocOpen = true
UseHugoToc = true
comments = false
mainSections = ['posts']
DateFormat = '2006-01-02'
displayFullLangName = true
hideSummary = false

[params.assets]
disableHLJS = true
favicon = '/favicon.svg'
favicon16x16 = '/favicon-16x16.png'
favicon32x32 = '/favicon-32x32.png'
apple_touch_icon = '/apple-touch-icon.png'
theme_color = '#f8f9fc'
msapplication_TileColor = '#3156a4'

[params.label]
text = "Youzhen's Notes"

[params.homeInfoParams]
Title = '把问题想清楚，把过程记下来。'
Content = 'LLMs · AI Infrastructure · Learning in public'

[[params.socialIcons]]
name = 'github'
url = 'https://github.com/1iyouzhen'

[[params.socialIcons]]
name = 'rss'
url = '/index.xml'

[params.editPost]
URL = 'https://github.com/1iyouzhen/1iyouzhen.github.io/edit/main/content'
Text = '在 GitHub 上编辑'
appendFilePath = true

[params.fuseOpts]
isCaseSensitive = false
shouldSort = true
includeMatches = true
findAllMatches = true
minMatchCharLength = 1
threshold = 0.35
keys = ['title', 'permalink', 'summary', 'content']

[markup.highlight]
noClasses = false
lineNos = false

[markup.goldmark.renderer]
unsafe = false

[markup.goldmark.extensions.passthrough]
enable = true
[markup.goldmark.extensions.passthrough.delimiters]
block = [['\[', '\]'], ['$$', '$$']]
inline = [['\(', '\)'], ['$', '$']]

[markup.tableOfContents]
startLevel = 2
endLevel = 3
ordered = false

[privacy.youtube]
privacyEnhanced = true

[services.rss]
limit = 30

[languages.zh]
label = '简体中文'
locale = 'zh-CN'
weight = 1
hasCJKLanguage = true
